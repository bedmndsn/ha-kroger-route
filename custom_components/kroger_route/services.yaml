refresh_route:
  name: Refresh route
  description: Immediately re-fetch the shopping list and rebuild the walking route.
  fields: &service_fields
    force_refresh:
      name: Force Refresh
      description: Bypass local cache and query Kroger API fresh.
      required: false
      default: false
      selector:
        boolean: {}
    location_id:
      name: Location ID
      description: Only refresh this store location. If omitted, all configured stores are refreshed.
      required: false
      selector:
        text: {}

process_list:
  name: Process list
  description: Alias of refresh_route (legacy name preserved for compatibility). Immediately re-fetch the shopping list and rebuild the walking route.
  fields: *service_fields
